<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
<style>
.wave{transform-box:fill-box;transform-origin:10% 90%;animation:wave 1.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.hr{animation:hr 5s ease-in infinite}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes tw{50%{transform:scale(1.5);opacity:.5}}
@keyframes hr{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
</style>
