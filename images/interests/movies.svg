<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2a44"/><stop offset="1" stop-color="#8a3f62"/></linearGradient></defs>
<style>
.clap{transform-origin:112px 78px;animation:clap 2.6s ease-in-out infinite}
