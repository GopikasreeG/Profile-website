<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e6d8"/><stop offset="1" stop-color="#cfb69a"/></linearGradient>
